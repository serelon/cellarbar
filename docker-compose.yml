services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cellarbar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cellarbar_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cellarbar}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cellarbar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cellarbar:cellarbar_dev@postgres:5432/cellarbar}
      PYTHONPATH: /app
      # OIDC (optional — unset = profile-pick auth)
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:-}
    ports:
      - "5177:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - images:/data/images
    command: >
      bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    ports:
      - "5180:80"
    depends_on:
      - backend
    profiles:
      - production

  mcp:
    build: ./mcp
    environment:
      BACKEND_URL: http://backend:8000
      MCP_TRANSPORT: http
      # MCP OAuth (optional — unset = unauthenticated, as before)
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      MCP_OIDC_AUDIENCE: ${MCP_OIDC_AUDIENCE:-}
      MCP_BASE_URL: ${MCP_BASE_URL:-}
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:-}
    ports:
      - "5178:5178"
    depends_on:
      - backend

volumes:
  pgdata:
  images:
